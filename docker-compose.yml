services:
  milovault:
    image: vaultwarden/server:1.37.5
    container_name: milovault
    restart: unless-stopped
    user: "10001:10001"
    stop_grace_period: 10s
    ports:
      - "18443:8443"
    volumes:
      - ./data:/data
    environment:
      # The platform opens https://${ip}:18443. A certificate for the NAS IP
      # cannot be generated inside the container, so a self-signed certificate
      # is created below with localhost/127.0.0.1 SANs. The browser will warn.
      DOMAIN: "https://localhost:18443"
      DATA_FOLDER: "/data"
      WEB_VAULT_ENABLED: "true"
      SIGNUPS_ALLOWED: "true"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "8443"
      ROCKET_TLS: '{certs="/data/certs/server.crt",key="/data/certs/server.key"}'
      TZ: "Asia/Shanghai"
      LOG_LEVEL: "warn"
      EXTENDED_LOGGING: "true"
      LOG_FILE: "/data/vaultwarden.log"
      SHOW_PASSWORD_HINT: "false"
      WEBSOCKET_ENABLED: "true"
      PUSH_ENABLED: "false"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /data/certs
        if [ ! -s /data/certs/server.crt ] || [ ! -s /data/certs/server.key ]; then
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout /data/certs/server.key \
            -out /data/certs/server.crt \
            -subj "/CN=milovault" \
            -addext "subjectAltName=DNS:localhost,DNS:milovault,DNS:tnas.local,IP:127.0.0.1"
          chmod 600 /data/certs/server.key
          chmod 644 /data/certs/server.crt
        fi
        exec /start.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1:8443/alive || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

x-app-meta:
  web:
    port: 18443
    protocol: https
